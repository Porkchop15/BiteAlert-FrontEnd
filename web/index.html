<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BiteAlert - Your Health Companion for Bite Cases and Vaccination Tracking">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BiteAlert">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BiteAlert</title>
  <link rel="manifest" href="manifest.json">
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading">
    <style>
      body {
        background-color: #FDF2DC;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
      }
      #loading {
        text-align: center;
        color: #7D0C0C;
      }
      #loading h1 {
        font-size: 24px;
        margin-bottom: 20px;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #7D0C0C;
        border-top: 4px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #error {
        display: none;
        color: #FF0000;
        padding: 20px;
        text-align: center;
        max-width: 80%;
        margin: 0 auto;
      }
    </style>
    <h1>Loading BiteAlert...</h1>
    <div class="spinner"></div>
  </div>
  <div id="error"></div>

  <script>
    window.addEventListener('load', function() {
      const loading = document.querySelector('#loading');
      const error = document.querySelector('#error');

      function showError(message) {
        console.error('Flutter initialization error:', message);
        error.textContent = 'Error initializing app: ' + message;
        error.style.display = 'block';
        loading.style.display = 'none';
      }

      function hideLoading() {
        loading.style.display = 'none';
      }

      // Wait a bit for Flutter to be ready
      setTimeout(function() {
        if (typeof _flutter === 'undefined') {
          showError('Flutter not loaded');
          return;
        }

        if (!_flutter.loader) {
          showError('Flutter loader not available');
          return;
        }

        // Try multiple initialization methods
        const initMethods = [
          // Method 1: loadEntrypoint (works on localhost/development)
          function() {
            if (typeof _flutter.loader.loadEntrypoint === 'function') {
              return _flutter.loader.loadEntrypoint();
            }
            throw new Error('loadEntrypoint not available');
          },
          // Method 2: load (works on web builds)
          function() {
            if (typeof _flutter.loader.load === 'function') {
              return _flutter.loader.load();
            }
            throw new Error('load not available');
          },
          // Method 3: Direct initialization (fallback)
          function() {
            return Promise.resolve(_flutter.loader);
          }
        ];

        // Try each method until one works
        function tryNextMethod(index) {
          if (index >= initMethods.length) {
            showError('All initialization methods failed');
            return;
          }

          initMethods[index]()
            .then(function(engineInitializer) {
              if (engineInitializer && typeof engineInitializer.initializeEngine === 'function') {
                return engineInitializer.initializeEngine();
              } else {
                throw new Error('Invalid engine initializer');
              }
            })
            .then(function(appRunner) {
              if (appRunner && typeof appRunner.runApp === 'function') {
                return appRunner.runApp();
              } else {
                throw new Error('Invalid app runner');
              }
            })
            .then(function() {
              hideLoading();
            })
            .catch(function(err) {
              console.warn('Method', index + 1, 'failed:', err.message);
              // Try next method
              tryNextMethod(index + 1);
            });
        }

        // Start with the first method
        tryNextMethod(0);
      }, 100); // Small delay to ensure Flutter is ready
    });
  </script>
</body>
</html>
